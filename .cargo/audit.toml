[advisories]
# time 0.3.46 DoS via RFC 2822 stack exhaustion — fix (0.3.47) requires Rust 1.88,
# but our MSRV is 1.83. Not exploitable: lopdf (our only consumer) doesn't parse
# user-provided RFC 2822 date strings. Will resolve when MSRV is bumped.
#
# RUSTSEC-2026-0187: lopdf 0.34 stack-overflow DoS on deeply nested PDF objects
# (uncatchable SIGABRT). Fix (lopdf >=0.42) needs Rust 1.85 > MSRV 1.83. The crash
# path is preflight-blocked by the nesting-depth guard in check_pdf (rules/rendered.rs)
# before load_mem runs; as of repo-0332 the preflight also decompresses and rescans
# every /ObjStm compressed object stream (fail-closed on undecodable/over-cap), so
# the compressed-stream bypass is closed too. Keep in sync with deny.toml; remove
# when MSRV/lopdf move.
#
# RUSTSEC-2026-0119: hickory-proto 0.24.4 encoder DoS. Fix is 0.26.1 (API
# break vs our 0.24 pin / MSRV 1.83). Tirith encodes only self-built DNS
# queries, not untrusted messages. Keep in sync with deny.toml.
#
# RUSTSEC-2024-0449: unsafe-libyaml is unmaintained (informational, no known
# vulnerability), pulled in only by the deprecated serde_yaml 0.9. Remove when
# serde_yaml is replaced. Keep in sync with deny.toml.
#
# RUSTSEC-2026-0367 / -0368 / -0369: zip 2.4.2 extract() keeps SUID/SGID bits,
# creates out-of-destination symlinks and applies permissions through symlinks.
# RUSTSEC-2026-0429: ZipArchive::extract also allocates a symlink target from its
# untrusted declared size. Tirith's own symlink evidence reader is capped at 4096
# bytes and never reserves from the declared size.
# Fix is zip >=9.0.0 (Rust 1.88 > MSRV 1.83). Tirith never calls ZipArchive or
# ZipStreamReader extract(): members are read into memory, symlink members are
# rejected, nothing is written to disk. Keep in sync with deny.toml.
#
# RUSTSEC-2026-0487 / -0489 / -0490: hickory-proto 0.24.4 panics in the
# zone-file (record text) parser. Tirith only sends queries and decodes wire
# responses through the system resolver; it never parses zone files or record
# text. Fix is 0.26.2 (API break vs our 0.24 pin / MSRV 1.83). Keep in sync
# with deny.toml.
#
# RUSTSEC-2026-0491: hickory-proto 0.24.4 reserves about 18 MB from the record
# counts in a DNS message header before reading any record. REACHABLE through a
# malicious resolver or a spoofed response to one of Tirith's own lookups. The
# allocation is transient and bounded per check by DnsRequestBudget and the
# resolver timeout; it is not memory corruption. Accepted until the resolver
# can move to >=0.26.2. Keep in sync with deny.toml.
#
# RUSTSEC-2026-0459: libsqlite3-sys 0.30.1 bundles a SQLite affected by
# CVE-2026-119375 (crafted `-wal` file). Only tools/policy-server and
# tools/license-server link it, and each opens only its own database, at a
# path the server operator configures. Fix needs rusqlite 0.41 (Rust 1.89 > MSRV
# 1.83). Keep in sync with deny.toml.
#
# RUSTSEC-2026-0441: pin-utils is unmaintained (informational, no known
# vulnerability, no fixed release), pulled in only through futures-util and
# hyper. Keep in sync with deny.toml.
ignore = ["RUSTSEC-2026-0009", "RUSTSEC-2026-0187", "RUSTSEC-2026-0119", "RUSTSEC-2024-0449", "RUSTSEC-2026-0367", "RUSTSEC-2026-0368", "RUSTSEC-2026-0369", "RUSTSEC-2026-0429", "RUSTSEC-2026-0487", "RUSTSEC-2026-0489", "RUSTSEC-2026-0490", "RUSTSEC-2026-0491", "RUSTSEC-2026-0459", "RUSTSEC-2026-0441"]
