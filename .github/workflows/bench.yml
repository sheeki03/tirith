name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Performance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Discard cached Criterion baselines
        # rust-cache intentionally restores compiled artifacts, but a partial
        # target/criterion tree makes Criterion emit diagnostics in the middle
        # of bencher records. Start each absolute-budget run from fresh samples
        # while preserving the expensive release compilation cache.
        run: rm -rf -- target/criterion

      - name: Run benchmarks
        # repo-0452: pipefail so a cargo bench failure cannot be masked by tee;
        # the downstream result step is gated on this step's success.
        run: |
          set -o pipefail
          cargo bench --locked --bench perf -- --output-format bencher | tee bench-output.txt

      # C19: the ABSOLUTE gate. The relative alert below reports but does not
      # fail, so on its own it can only answer "slower than last week" and never
      # "fast enough": a sequence of sub-threshold regressions passes it
      # indefinitely. These ceilings are generous enough that runner noise
      # cannot trip them and tight enough to catch an order-of-magnitude
      # regression. Derivation is written down in benches/budgets.txt.
      - name: Enforce absolute benchmark budgets
        run: ./scripts/check-bench-budgets.sh bench-output.txt

      # Allocation regression gate. The ceilings are plain committed numbers
      # (about 25% above the measured ubuntu-latest values), so a version bump,
      # a new toolchain or a runner image refresh cannot fail this step; only
      # real allocation growth can. Raise a ceiling deliberately when growth is
      # intended. Derivation: crates/tirith-core/benches/resource_ceilings.json.
      - name: Enforce allocation ceilings
        run: >-
          cargo bench --locked -p tirith-core --bench resource_counts --
          --output "$GITHUB_WORKSPACE/resource-allocations.json"
          --ceilings "$GITHUB_WORKSPACE/crates/tirith-core/benches/resource_ceilings.json"

      # Informational only: which source, toolchain and runner produced the
      # numbers above. Nothing compares or pins these values.
      - name: Record measurement provenance
        if: always()
        run: |
          {
            echo "source_revision: $GITHUB_SHA"
            echo "run: $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
            echo "runner: ${ImageOS:-unknown} ${ImageVersion:-unknown} $(uname -srm)"
            rustc -Vv
            cargo -V
          } > resource-provenance.txt

      - name: Upload allocation report and provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resource-allocations-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            resource-allocations.json
            resource-provenance.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload trusted-main benchmark input
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: bench-output.txt
          if-no-files-found: error

  publish-baseline:
    name: Publish trusted main benchmark baseline
    needs: benchmark
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download benchmark output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-output

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: tirith benchmarks
          tool: cargo
          output-file-path: benchmark-output/bench-output.txt
          alert-threshold: "115%"
          comment-on-alert: false
          fail-on-alert: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
