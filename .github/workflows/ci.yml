name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel any in-progress run for the same ref when a new commit lands.
# Prevents stacked runs from saturating the (limited) Linux runner pool.
# `github.ref` is used only as a key (not interpolated into any run: step),
# so this is not a command-injection surface.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  workflow-integrity:
    name: Workflow and ThreatDB fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Validate workflow shell syntax
        run: bash -n .github/scripts/fetch-threatdb-sources.sh .github/scripts/test-fetch-threatdb-sources.sh
      - name: Validate fail-closed ThreatDB fetch orchestration
        run: bash .github/scripts/test-fetch-threatdb-sources.sh

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # The full workspace test suite completes well under this locally; fail
    # runner wedges instead of leaving CI stuck in-progress for an hour.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rust: stable, name: "Linux" }
          - { os: macos-latest, rust: stable, name: "macOS" }
          - { os: windows-latest, rust: stable, name: "Windows" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.17.0"
      - name: OpenClaw shell resolver contract
        run: node tests/openclaw-shell-resolver.mjs
      - name: Install interactive shell conformance dependencies
        if: matrix.name == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fish zsh
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - run: cargo test --workspace --locked
      - name: Production capsule reviewed-file receipt
        if: matrix.name == 'Linux'
        env:
          TIRITH_REQUIRE_CAPSULE_RECEIPT: "1"
        run: >-
          cargo test -p tirith --test cli_integration
          hidden_capsule_landlock_reads_reviewed_file_through_sealed_memfd_magic_link
          --locked -- --exact --nocapture

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    # Match the main test job: treat prolonged runner hangs as failures.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - run: cargo test --workspace --locked

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  install-script:
    name: Install script (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: "Linux" }
          - { os: macos-latest, name: "macOS" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Shell syntax check
        run: sh -n scripts/install.sh
      - name: verify_sha256 regression tests
        run: sh tests/install-sh/verify_sha256.sh
