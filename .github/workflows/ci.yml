name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel any in-progress run for the same ref when a new commit lands.
# Prevents stacked runs from saturating the (limited) Linux runner pool.
# `github.ref` is used only as a key (not interpolated into any run: step),
# so this is not a command-injection surface.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  workflow-integrity:
    name: Workflow and ThreatDB fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflow shell syntax
        run: bash -n .github/scripts/fetch-threatdb-sources.sh .github/scripts/test-fetch-threatdb-sources.sh
      - name: Validate fail-closed ThreatDB fetch orchestration
        run: bash .github/scripts/test-fetch-threatdb-sources.sh

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # A wedge detector, not a capacity budget. The suite has grown past what
    # this comment used to assume: `Test (Linux)` measures 10min on the base of
    # this stack and 19min at its head, so a 20min cap left about a minute of
    # headroom and tipped over on any cold `rust-cache` restore or slow runner.
    # GitHub records a timed-out job as CANCELLED, so it read as an unexplained
    # red check rather than a timeout. A genuine wedge runs indefinitely and is
    # still caught well inside this.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rust: stable, name: "Linux" }
          - { os: macos-latest, rust: stable, name: "macOS" }
          - { os: windows-latest, rust: stable, name: "Windows" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.17.0"
      - name: OpenClaw shell resolver contract
        run: node tests/openclaw-shell-resolver.mjs
      - name: IPython execution-vector extraction contract
        run: node tests/ipython-vector-extraction.mjs
      - name: Install interactive shell conformance dependencies
        if: matrix.name == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fish zsh
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked
      - name: Production capsule reviewed-file receipt
        if: matrix.name == 'Linux'
        env:
          TIRITH_REQUIRE_CAPSULE_RECEIPT: "1"
        run: >-
          cargo test -p tirith --test cli_integration
          hidden_capsule_landlock_reads_reviewed_file_through_sealed_memfd_magic_link
          --locked -- --exact --nocapture

  bash-53:
    # The hosted images ship bash 5.2, and the interactive-shell tests accept
    # any bash >= 5, so every enter-mode and preexec assertion in CI has only
    # ever run against 5.2. Issue #158 is reported against 5.3.15 and the
    # extdebug/PROMPT_COMMAND ownership work in #176 exists because of it, so
    # the version those bugs live on is the one version CI never exercised.
    # Build it from the GNU release (sha256 pinned, same discipline as the
    # action pins) and re-run the bash suites against it.
    name: Bash 5.3 shell hooks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASH_VERSION_UNDER_TEST: "5.3"
      BASH_TARBALL_SHA256: "0d5cd86965f869a26cf64f4b71be7b96f90a3ba8b3d74e27e8e9d9d5550f31ba"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build bash ${{ env.BASH_VERSION_UNDER_TEST }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          tarball="bash-${BASH_VERSION_UNDER_TEST}.tar.gz"
          # Two GNU sources, tried in order. The sha256 below is the integrity
          # check either way; the mirror only stops an upstream outage from
          # turning into a red PR check. Both were verified byte-identical when
          # this pin was taken.
          fetched=0
          for host in "https://ftp.gnu.org/gnu/bash" "https://mirrors.kernel.org/gnu/bash"; do
            if curl -fsSL --retry 3 --retry-delay 5 -o "$tarball" "${host}/${tarball}"; then
              echo "fetched ${tarball} from ${host}"
              fetched=1
              break
            fi
            echo "could not fetch ${tarball} from ${host}, trying the next source" >&2
          done
          if [[ $fetched -ne 1 ]]; then
            echo "ERROR: could not fetch ${tarball} from any known GNU source" >&2
            exit 1
          fi
          echo "${BASH_TARBALL_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball"
          cd "bash-${BASH_VERSION_UNDER_TEST}"
          ./configure --prefix="$HOME/bash53" >/dev/null
          make -j"$(nproc)" >/dev/null
          make install >/dev/null
          "$HOME/bash53/bin/bash" --version | head -1
      - name: Put bash ${{ env.BASH_VERSION_UNDER_TEST }} first on PATH
        run: |
          set -euo pipefail
          echo "$HOME/bash53/bin" >> "$GITHUB_PATH"
      - name: Confirm the suites will see it
        run: |
          set -euo pipefail
          resolved="$(command -v bash)"
          echo "bash resolves to ${resolved}"
          case "$("$resolved" --version | head -1)" in
            *"version ${BASH_VERSION_UNDER_TEST}"*) ;;
            *)
              echo "ERROR: expected bash ${BASH_VERSION_UNDER_TEST} first on PATH" >&2
              exit 1
              ;;
          esac
      - name: Install interactive shell conformance dependencies
        run: sudo apt-get update && sudo apt-get install --yes fish zsh
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Bash hook suites on ${{ env.BASH_VERSION_UNDER_TEST }}
        run: >-
          cargo test -p tirith --locked
          --test bash_preexec_enforce
          --test bash_hook_exports
          --test shell_conformance

  msrv:
    name: MSRV (1.83)
    runs-on: ubuntu-latest
    # Match the main test job: treat prolonged runner hangs as failures.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.83"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install cargo-deny --locked
      - run: cargo deny check
      # `fuzz/` declares its own `[workspace]`, so the root check above never
      # resolves libfuzzer-sys or anything under it -- the NCSA entry in
      # deny.toml's allow-list was allowing a license for a tree nothing audited.
      # The fuzz targets are built and run by CI, so a fuzz-only advisory is a
      # real exposure. Reuses the root deny.toml deliberately: one allow-list.
      # (tools/rustsec-probe is also detached but is a one-off research probe
      # that never enters the product build, so it stays uncovered.)
      # No `--config`: it defaults to <cwd>/deny.toml, which is the root config
      # this deliberately reuses. Do NOT pass the flag explicitly -- it moved
      # from the `check` subcommand (0.19) to global scope (0.20), so either
      # spelling breaks on the other version, and the step above installs
      # whatever cargo-deny is newest.
      - run: cargo deny --manifest-path fuzz/Cargo.toml check

  install-script:
    name: Install script (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: "Linux" }
          - { os: macos-latest, name: "macOS" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shell syntax check
        run: sh -n scripts/install.sh
      - name: verify_sha256 regression tests
        run: sh tests/install-sh/verify_sha256.sh
      - name: package-approval helper return-path tests
        run: sh tests/install-sh/package_approval_helper_returns.sh

  artifact-roundtrip-produce:
    name: Artifact protocol (upload)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create deterministic artifact fixture
        run: |
          set -euo pipefail
          mkdir -p artifact-roundtrip-primary/nested artifact-roundtrip-secondary
          printf 'tirith-artifact-roundtrip\n' > artifact-roundtrip-primary/plain.txt
          dd if=/dev/zero of=artifact-roundtrip-primary/nested/binary.bin bs=1024 count=4 status=none
          (
            cd artifact-roundtrip-primary
            sha256sum plain.txt nested/binary.bin > SHA256SUMS.primary
          )
          printf 'second-release-artifact\n' > artifact-roundtrip-secondary/secondary.txt
          (
            cd artifact-roundtrip-secondary
            sha256sum secondary.txt > SHA256SUMS.secondary
          )
      - name: Upload primary fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-artifact-roundtrip-${{ github.run_id }}-primary
          path: artifact-roundtrip-primary/
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Upload secondary fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-artifact-roundtrip-${{ github.run_id }}-secondary
          path: artifact-roundtrip-secondary/
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  artifact-roundtrip-verify:
    name: Artifact protocol (download)
    needs: artifact-roundtrip-produce
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download fixture
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-artifact-roundtrip-${{ github.run_id }}-*
          path: artifact-roundtrip
          merge-multiple: true
          digest-mismatch: error
      - name: Verify fixture bytes and layout
        run: |
          set -euo pipefail
          test "$(find artifact-roundtrip -type f | wc -l)" -eq 5
          cd artifact-roundtrip
          sha256sum --check SHA256SUMS.primary
          sha256sum --check SHA256SUMS.secondary
          test "$(cat plain.txt)" = "tirith-artifact-roundtrip"
          test "$(cat secondary.txt)" = "second-release-artifact"

  action-runtime-validation:
    name: Action runtimes (no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the release-compatible Cosign CLI
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1
      - name: Verify the pinned Cosign CLI version
        run: cosign version | grep --fixed-strings 'GitVersion' | grep --fixed-strings 'v2.6.1'
      - name: Prepare a publication-free multi-platform image context
        run: |
          set -euo pipefail
          mkdir -p docker-ci-smoke/bin docker-ci-smoke/shell
          printf '#!/bin/sh\nprintf "tirith-ci-smoke\\n"\n' > docker-ci-smoke/bin/tirith
          chmod +x docker-ci-smoke/bin/tirith
          cp -R shell/. docker-ci-smoke/shell/
          cp Dockerfile docker-ci-smoke/
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: tonistiigi/binfmt:qemu-v9.2.0@sha256:ea2f0dd74e74f101df59f9a6b31d0960994060c7982a921cbceecee0f1841125
          platforms: arm64
          cache-image: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the release image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker-ci-smoke
          platforms: linux/amd64,linux/arm64
          push: false
          tags: tirith-ci-smoke:${{ github.sha }}
          outputs: type=oci,dest=${{ runner.temp }}/tirith-ci-smoke.tar
      - name: Verify the OCI image was exported
        run: |
          test -s "${{ runner.temp }}/tirith-ci-smoke.tar"
          tar -tf "${{ runner.temp }}/tirith-ci-smoke.tar" | grep --fixed-strings 'index.json'
