name: Native PowerShell startup diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-startup:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Observe six bounded startup cases
        shell: pwsh
        run: |
          $driver = Join-Path $PWD '.github/qualification/diagnose-powershell-startup.ps1'
          if ((Get-FileHash -LiteralPath $driver -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'a945cd77e67f16b7c2e20bc5af7d0ef8869ae56548510222060bc598699bcbfa') { throw 'Diagnostic driver pin differs' }
          & $driver -Workspace $PWD -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'powershell-startup-diagnostic')
      - name: Retain original startup observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: powershell-startup-diagnostic-windows
          path: ${{ runner.temp }}/powershell-startup-diagnostic
          if-no-files-found: error
          retention-days: 14
  linux-runtime-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read installed runtime metadata without execution
        env:
          DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/powershell-runtime-inventory
        run: |
          python3 -B - <<'PY'
          import hashlib,os,runpy,sys
          from pathlib import Path
          driver=Path('.github/qualification/inventory-linux-powershell.py')
          if hashlib.sha256(driver.read_bytes()).hexdigest()!='37c718833a2d4797e6a340ee5eef6f4b441a71d5554e27783331b165381f0947':
              raise SystemExit('Diagnostic driver pin differs')
          sys.argv=[str(driver),'--output',os.environ['DIAGNOSTIC_OUTPUT']]
          runpy.run_path(str(driver),run_name='__main__')
          PY
      - name: Retain original runtime inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: powershell-runtime-inventory-linux
          path: ${{ runner.temp }}/powershell-runtime-inventory
          if-no-files-found: error
          retention-days: 14
