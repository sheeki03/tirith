name: Native PowerShell startup diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-startup:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Observe six bounded process query cases
        shell: pwsh
        run: |
          $driver = Join-Path $PWD '.github/qualification/diagnose-powershell-startup.ps1'
          if ((Get-FileHash -LiteralPath $driver -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'f61ad87a3e9e3f2163c1fbc8834f9b6b1076af27bd106a47b37c7c223b25961c') { throw 'Diagnostic driver pin differs' }
          & $driver -Workspace $PWD -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'powershell-startup-diagnostic')
      - name: Retain original startup observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: powershell-startup-diagnostic-windows
          path: ${{ runner.temp }}/powershell-startup-diagnostic
          if-no-files-found: error
          retention-days: 14
