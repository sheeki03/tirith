# Tirith MCP Gateway configuration
#
# Place this file alongside your MCP server config and reference it with:
#   tirith gateway run --upstream-bin <path> --config tirith-gateway.yaml
#
# Each guarded_tool entry matches tool names via regex and extracts the
# command string via JSON Pointer paths resolved against the `params` object
# of the tools/call request.

guarded_tools:
  # Broad POSIX shell tool names used across Codex/Cursor/VS Code extensions
  - pattern: "^(Bash|bash|shell|sh|zsh|terminal|Terminal|terminal_exec|terminalExec|run_shell|runShell|run_shell_command|runShellCommand|shell_command|shellCommand|command_shell|commandShell)$"
    command_paths: ["/arguments/command", "/arguments/cmd", "/arguments/script", "/arguments/code", "/command", "/cmd", "/script", "/code"]
    shell: posix

  # PowerShell tools
  - pattern: "^(pwsh|powershell|PowerShell|pwsh_command|pwshCommand|powershell_command|powershellCommand)$"
    command_paths: ["/arguments/command", "/arguments/cmd", "/arguments/script", "/arguments/code", "/command", "/cmd", "/script", "/code"]
    shell: powershell

  # Generic execute/run naming variants
  - pattern: "^(run_command|runCommand|execute|execute_command|executeCommand|exec|exec_command|execCommand|run_cmd|runCmd|command_exec|commandExec)$"
    command_paths: ["/arguments/command", "/arguments/cmd", "/arguments/script", "/arguments/code", "/command", "/cmd", "/script", "/code"]
    shell: posix

policy:
  # What to do when tirith reports a "warn" verdict:
  #   "forward" - forward the command and inject findings into the response
  #   "allow"   - synonym for "forward"
  #   "deny"    - treat warnings as denials (bundled hardened default)
  warn_action: "deny"

  # Response-path posture after a guarded request was inspected:
  #   "open"   - compatibility posture for explicitly accepted response risk
  #   "closed" - deny when a correlated response cannot be inspected (default)
  # Request-side command extraction, worker, registration, and analysis failures
  # always deny before forwarding in both modes.
  fail_mode: "closed"

  # An autonomous MCP boundary must deny on uncertainty. Operators who deliberately
  # choose compatibility over this guarantee can set `open` in a private config.

  # Maximum non-zero time (ms) to wait for Tirith command analysis. A timeout
  # always denies before forwarding; fail_mode does not override request-side
  # extraction, worker, registration, or analysis failures.
  timeout_ms: 10000

  # Maximum bytes per JSON-RPC message line (DoS protection)
  # Oversize messages trigger immediate session termination
  max_message_bytes: 262144  # 256 KiB

  # How long (ms) an in-flight request waits for its response before it becomes a
  # TimedOut tombstone. The entry is NOT deleted at the deadline: a response that
  # arrives later is still matched against the tombstone and handled per fail_mode
  # (closed -> blocked, open -> dropped), so a slow upstream can never let a stale
  # response through unfiltered.
  pending_timeout_ms: 30000  # 30s

  # How long (ms) a tombstone is retained after it is created before garbage
  # collection. Bounds memory while keeping late-response detection effective for
  # the retention window.
  tombstone_retention_ms: 60000  # 60s

  # Absolute in-memory/concurrency ceilings. Backpressure is applied before
  # these limits can be exceeded.
  max_pending_requests: 1024
  max_output_queue: 256
  max_analysis_workers: 4
