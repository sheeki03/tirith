# C13: the fetch-and-run half of the npm family. Every form below reaches the
# same shared grammar (`crate::npm_command`) as `npm install`, so a malicious
# package named to `npm exec`/`pnpm dlx`/`bunx` is assessed exactly as one named
# to `npm install`. These are deliberately non-allow fixtures: they are what
# makes `test_tier1_does_not_gate_findings` prove the build.rs PATTERN_TABLE
# fragments exist for each new form.
[[fixture]]
name = "npm_exec_malicious_package"
min_milestone = 1
input = "npm exec evil-package@1.0.0"
context = "exec"
expected_action = "block"
expected_rules = ["threat_malicious_package"]

