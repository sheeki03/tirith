# The explicit package option is assessed, and the entrypoint that follows it is
# the child binary, not a second package.
[[fixture]]
name = "npx_explicit_package_option_is_assessed"
min_milestone = 1
input = "npx --package evil-package@1.0.0 runner"
context = "exec"
expected_action = "block"
expected_rules = ["threat_malicious_package"]

# The runner boundary: once the child entrypoint is located, its arguments
# belong to it. `--package evil-package` here is `cowsay`'s argument.
[[fixture]]
name = "npx_child_arguments_are_not_packages"
min_milestone = 1
input = "npx cowsay --package evil-package@1.0.0"
context = "exec"
expected_action = "allow"
expected_rules = []
forbidden_rules = ["threat_malicious_package"]

# `pnpm exec` runs a binary already installed in the project; it fetches
# nothing, so its first positional is not a package name.
[[fixture]]
name = "pnpm_exec_names_no_package"
min_milestone = 1
input = "pnpm exec evil-package"
context = "exec"
expected_action = "allow"
expected_rules = []
forbidden_rules = ["threat_malicious_package", "threat_unresolved_malicious_package"]

# `npm run <script>` is package.json indirection. A script may be NAMED after a
# malicious package without being one, and this grammar never reads package.json.
[[fixture]]
name = "npm_run_script_names_no_package"
min_milestone = 1
input = "npm run evil-package"
context = "exec"
expected_action = "allow"
expected_rules = []
forbidden_rules = ["threat_malicious_package", "threat_unresolved_malicious_package"]
