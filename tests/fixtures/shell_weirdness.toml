# ── 0.5.0 fix round C3: here-strings, xargs -I, brace-group redirections,
# array element assignments and numeric arithmetic (FPPERF-2) ─────────────
# These used to fail closed as analysis_incomplete. A here-string is stdin
# data for an ordinary command and code for a shell that reads its script
# from stdin; a non-shell interpreter keeps it unresolved. `xargs -I{}` runs
# its command with the item substituted, unresolved when the item lands in
# code. A brace group with only trailing redirections is analyzed like a
# subshell. `name[key]=v` needs a digit subscript or an unconditional
# `typeset -A`. Arithmetic over `nproc`, `getconf`, `sysctl -n hw.*` and
# `wc -l < file` is numeric; any other output stays unresolved.
[[fixture]]
name = "here_string_to_cat_allowed"
min_milestone = 1
input = "cat <<< \"hello\""
context = "exec"
expected_action = "allow"
expected_rules = []
forbidden_rules = ["analysis_incomplete"]

