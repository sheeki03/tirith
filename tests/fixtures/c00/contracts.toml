# scripts, current authority/confinement checks and production-signed v2 data.
# Native runs 36444393465 and 36447327426 supply explicit fixture-authority
# qualification; production-feed publication remains a separate prerequisite.
# This reviewed addition replaces digest
# 36a81bdd0c28147d1395fc208855031bca72d295be07b74b985fe6e083edd6d4.
# The exact-byte compatibility guard remains unchanged.
#
# Next-cycle compatibility review (71070bbb): parsed and compared the complete
# previous/current manifest before approving this freeze. 88 entries become 89:
# `review` is added as partial/read-only; zero existing entries are removed,
# renamed, regrouped or reordered. manifest_version stays 1. Exactly eight
# existing coverage descriptions change: capsule run (native ARM, conditional
# controls and release qualification caveat), task check (bounded package
# families; preview only), dashboard (authenticated typed plans; partial scope),
# setup (shared journal, configuration is not interception), package (local npm
# artifact inspection; no install approval), and audit (bounded history and
