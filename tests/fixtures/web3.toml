# ── C10 — Web3 execution-boundary rules ───────────────────────────────────
#
# The shapes C05 deliberately reserved: cast/forge/hardhat/solana/anchor
# invocations that the bounded parser resolves into on-chain writes and signer
# exposure. Every destination is a documentation address and every key is a
# synthetic all-`a` scalar; nothing here is a real address or a funded key.
#
# The policy rule is NOT exercised here. It depends on a trusted `web3_guard`
# that a fixture cannot declare (a repo-scope policy is neutralized by design),
