# C05 — Web3 wallet data and source-to-sink exfiltration.
#
# Every C05 fixture name starts with `c05_exfil_`. Destinations use reserved
# `.invalid` domains and documentation-only IP addresses. Inputs contain paths
# and symbolic environment references only; no real wallet material is stored.
#
# The corpus intentionally avoids cast/forge/hardhat/solana/anchor, package
# runners, RPC endpoints, and state-changing Web3 operations. Those shapes are
# owned by C06/C10 and later slices.

