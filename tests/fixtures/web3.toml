# ── C19 cross-cutting coverage for what C06 through C12 built ───────────
#
# C06 built the bounded operation parser, C07 the monotonic `web3_guard`, C10
# wired the three rules, and C12 enforces at owned transitions. Individual
# slices proved their own unit contracts; these entries pin the shapes only the
# whole pipeline can decide, and every one is reachable from Tier 1 in exec
# context (`test_tier1_coverage`).
#
# Addresses are the canonical low-numbered non-addresses, hosts are reserved
# `.invalid` names, and no fixture stores real key material.

# ── C06 the bounded operation parser, seen through the rules ────────────

