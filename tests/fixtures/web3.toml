# A raw key in the signer's own leading environment assignment is the same
# exposure as the flag, and it is the same SIGNER: Foundry reads its wallet
# options from the environment when the flag is absent, so `ETH_PRIVATE_KEY`
# selects the key this command signs with. The equivalence is asserted, not
# implied: `web3_signer_risk` is named here and in the flag fixture below, so a
# regression in either form breaks a fixture.
[[fixture]]
name = "c12_leading_environment_private_key_is_a_signer_risk"
min_milestone = 13
input = "ETH_PRIVATE_KEY=0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa cast send 0x0000000000000000000000000000000000000001 --rpc-url https://rpc.example.invalid"
context = "exec"
expected_action = "block"
expected_rules = ["web3_state_changing_command", "web3_signer_risk", "private_key_exposed"]

# The flag form of the same command, so the pair pins the equivalence in both
# directions rather than only asserting the half that was already true.
[[fixture]]
name = "c12_private_key_flag_is_a_signer_risk"
min_milestone = 13
input = "cast send 0x0000000000000000000000000000000000000001 --rpc-url https://rpc.example.invalid --private-key 0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
context = "exec"
expected_action = "block"
expected_rules = ["web3_state_changing_command", "web3_signer_risk", "private_key_exposed"]

# And the boundary of the claim. `PRIVATE_KEY` is NOT a Foundry variable, so it
# does not select this command's signer and the Web3 signer classifier must not
# say it does. The key is still raw secret material in the process environment,
# which the generic credential rule reports at CRITICAL, so the command is
# still blocked. `forbidden_rules` is what keeps this honest: without it the
# subset assertion would pass whether or not the signer rule fired.
[[fixture]]
name = "c12_non_foundry_environment_key_is_exposure_not_a_signer"
min_milestone = 13
input = "PRIVATE_KEY=0xaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa cast send 0x0000000000000000000000000000000000000001 --rpc-url https://rpc.example.invalid"
context = "exec"
expected_action = "block"
expected_rules = ["web3_state_changing_command", "private_key_exposed"]
forbidden_rules = ["web3_signer_risk"]

# A symbolic reference is still raw signer material, and the rule's own
# rationale is why: the shell expands `$DEPLOYER_KEY` before `cast` runs, so the
# key lands in argv and is readable from the process table exactly as a literal
# would be. Treating the indirection as safer than the literal would teach the
# one workaround that changes nothing about the exposure.
[[fixture]]
name = "c12_symbolic_private_key_reference_is_still_a_raw_signer"
min_milestone = 13
input = "cast send 0x0000000000000000000000000000000000000001 --rpc-url https://rpc.example.invalid --private-key \"$DEPLOYER_KEY\""
context = "exec"
expected_action = "block"
expected_rules = ["web3_state_changing_command", "web3_signer_risk"]

