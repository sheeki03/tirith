# --- 0.5.0 C4 (FPPERF-8): a request that provably stays on this machine has
# no network attacker: insecure TLS is Low and a schemeless loopback operand is
# not a scheme-ambiguity risk. The engine verdict for a Low finding is warn; the
# CLI's default paranoia (1) drops Low findings, so `tirith check` allows these. ---

[[fixture]]
name = "c4_insecure_tls_localhost_is_low"
min_milestone = 1
input = "curl -k https://localhost:8443/health"
context = "exec"
expected_action = "warn"
expected_rules = ["insecure_tls_flags"]
forbidden_rules = ["analysis_incomplete"]

[[fixture]]
name = "c4_insecure_tls_127_is_low"
min_milestone = 1
input = "curl --insecure https://127.0.0.1:8443/"
context = "exec"
expected_action = "warn"
expected_rules = ["insecure_tls_flags"]
forbidden_rules = ["analysis_incomplete"]

[[fixture]]
name = "c4_insecure_tls_ipv6_loopback_is_low"
min_milestone = 1
input = "curl -sk 'https://[::1]:8443/health'"
context = "exec"
expected_action = "warn"
expected_rules = ["insecure_tls_flags"]
forbidden_rules = ["analysis_incomplete"]

[[fixture]]
name = "c4_insecure_tls_wget_loopback_is_low"
min_milestone = 1
input = "wget --no-check-certificate https://localhost:8443/health"
context = "exec"
expected_action = "warn"
expected_rules = ["insecure_tls_flags"]
forbidden_rules = ["analysis_incomplete"]

[[fixture]]
name = "c4_insecure_tls_remote_still_blocks"
min_milestone = 1
input = "curl -k https://example-cli.dev/health"
context = "exec"
expected_action = "block"
expected_rules = ["insecure_tls_flags"]

[[fixture]]
name = "c4_insecure_tls_loopback_plus_remote_blocks"
min_milestone = 1
input = "curl -k https://localhost:8443/ https://example-cli.dev/"
context = "exec"
expected_action = "block"
expected_rules = ["insecure_tls_flags"]

