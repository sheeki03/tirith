# ── Round 4: pipe sinks behind process wrappers ─────────────────────────────
# `nice`, `timeout`, `setsid`, `taskset`, `ionice`, `flock FILE`, `chrt` and
# `builtin command` run their child with the pipe's stdin unchanged, so the
# interpreter behind them receives the piped bytes. Their option grammars are
