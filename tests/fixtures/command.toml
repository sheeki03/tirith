# Pin double-fire boundary: the pipe form must fire pipe_to_interpreter
# and must NOT also fire ps_inline_download_execute. A future regression
# that removes the preceding_separator skip would silently double-fire.
forbidden_rules = ["ps_inline_download_execute"]

# `;` chains produce independent commands — `pipe_to_interpreter` does NOT
# match, so `ps_inline_download_execute` must still fire on the trailing
# segment. Before the fix the `preceding_separator.is_some()` guard
# silently skipped this.
#
# Note: PowerShell pre-7 doesn't tokenize `&&`/`||` as pipeline chain
# operators (PowerShell 7+ does). Extending the PS tokenizer to split on
# them is a separate change; this `;` fixture is sufficient to pin the
# narrowed-skip-guard fix itself.
[[fixture]]
name = "ps_iex_inline_after_semicolon_chained"
min_milestone = 5
input = "true; iex (iwr https://example-cli.dev/install.ps1)"
context = "exec"
shell = "powershell"
expected_action = "block"
expected_rules = ["ps_inline_download_execute"]

