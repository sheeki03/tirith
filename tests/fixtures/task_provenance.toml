# C08/C11/C12: task envelope, provenance assignment, and the capability
# decision, end to end through the crate's PUBLIC API only.
#
# Driven by `crates/tirith-core/tests/c19_cross_cutting.rs`. Each case parses
# `envelope_json` exactly as an untrusted caller would supply it, assigns
# provenance through the named ingress adapter, and decides under the named
# gate. Everything asserted here is a contract an external caller (gateway, MCP
# adapter, CLI) actually gets.
#
# Fields:
#   parse_error            expected `rejection_token` when parsing must fail
#                          outright; the case ends there.
#   adapter                Tirith-owned ingress. Never taken from the document.
#   gate                   "off" | "observe" | "enforce".
#   boundary               "observe_only" | "boundary_dependent" | "enforceable".
#   expect_rejections      `rejection_token` values from `validate_envelope`.
#   expect_effective       assigned source kind per source, in order.
#   expect_receipt_status  assigned receipt status per source, in order.
#   expect_inferred/allowed/denied   effect sets on the decision.
#   expect_complete        the decision's completeness.
#   expect_enforceability  the decision's boundary capability.
#
# Sizes that must exceed a cap are built by the driver from `repeat_field` /
# `repeat_len` rather than stored inline, so this file stays readable and no
# multi-kilobyte literal lives in the repository.

# ── Parse-level refusals ──────────────────────────────────────────────────

[[case]]
name = "unknown_top_level_field_is_malformed"
envelope_json = '''{"sources": [], "actions": [], "trusted": true}'''
parse_error = "malformed"

[[case]]
name = "unknown_source_field_is_malformed"
envelope_json = '''{"sources": [{"claimed_source": "issue_body", "content": "x", "verified": true}], "actions": []}'''
parse_error = "malformed"

[[case]]
name = "duplicate_json_key_is_malformed"
envelope_json = '''{"sources": [], "sources": [{"claimed_source": "issue_body", "content": "x"}], "actions": []}'''
parse_error = "malformed"

[[case]]
name = "unknown_source_kind_is_malformed"
envelope_json = '''{"sources": [{"claimed_source": "operator_terminal", "content": "x"}], "actions": []}'''
parse_error = "malformed"

[[case]]
name = "unknown_action_shape_is_malformed"
envelope_json = '''{"sources": [], "actions": [{"deploy": {"target": "prod"}}]}'''
parse_error = "malformed"

[[case]]
name = "excessive_json_depth_is_malformed"
repeat_field = "json_depth"
repeat_len = 64
envelope_json = ""
parse_error = "malformed"

# ── Bounded-input refusals that survive parsing ───────────────────────────

[[case]]
name = "oversized_single_source_is_rejected"
repeat_field = "source_content"
repeat_len = 20000
envelope_json = ""
adapter = "github_issue"
gate = "enforce"
boundary = "enforceable"
expect_rejections = ["source_too_large(max=16384)"]
expect_effective = ["issue_body"]
expect_receipt_status = ["unverified"]
expect_inferred = []
expect_allowed = []
expect_denied = []
expect_complete = false
expect_enforceability = "enforceable"

