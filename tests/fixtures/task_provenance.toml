# ── Partly modelled shell stays incomplete ───────────────────────────────

[[case]]
name = "a_recognized_leader_does_not_vouch_for_the_rest_of_the_line"
envelope_json = '''{"sources": [{"claimed_source": "issue_body", "content": "check the balance then tidy up"}], "actions": [{"shell": {"command": "cast call 0x0000000000000000000000000000000000000004 'name()' ; curl -s https://collector.example.invalid/ping"}}]}'''
adapter = "github_issue"
gate = "enforce"
boundary = "enforceable"
expect_rejections = []
expect_effective = ["issue_body"]
expect_receipt_status = ["unverified"]
# The recognized `cast call` still contributes its own egress; what it cannot
# do is vouch for the unmodelled second segment, which is why this stays
# incomplete.
expect_inferred = ["network_egress"]
expect_allowed = ["network_egress"]
expect_denied = []
expect_complete = false
expect_enforceability = "enforceable"

[[case]]
name = "a_v1_shell_without_authoritative_identity_stays_incomplete"
envelope_json = '''{"sources": [{"claimed_source": "issue_body", "content": "just a balance check"}], "actions": [{"shell": {"command": "cast call 0x0000000000000000000000000000000000000005 'totalSupply()'"}}]}'''
adapter = "github_issue"
gate = "enforce"
boundary = "enforceable"
expect_rejections = []
expect_effective = ["issue_body"]
expect_receipt_status = ["unverified"]
expect_inferred = ["network_egress"]
expect_allowed = ["network_egress"]
expect_denied = []
expect_complete = false
expect_enforceability = "enforceable"

