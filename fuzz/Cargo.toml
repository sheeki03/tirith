[package]
name = "tirith-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
# This is a separate workspace, so it does not inherit `license.workspace`.
# Declared explicitly (matching tools/rustsec-probe) so `cargo deny` can audit
# the fuzz dependency tree instead of failing the whole run as unlicensed.
license = "AGPL-3.0-only"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tirith-core = { path = "../crates/tirith-core" }

[workspace]
members = ["."]

[[bin]]
name = "url_parser"
path = "fuzz_targets/url_parser.rs"
doc = false

[[bin]]
name = "tokenizer_posix"
path = "fuzz_targets/tokenizer_posix.rs"
doc = false

[[bin]]
name = "tokenizer_fish"
path = "fuzz_targets/tokenizer_fish.rs"
doc = false

[[bin]]
name = "tokenizer_powershell"
path = "fuzz_targets/tokenizer_powershell.rs"
doc = false

[[bin]]
name = "extractor"
path = "fuzz_targets/extractor.rs"
doc = false

[[bin]]
name = "normalizer"
path = "fuzz_targets/normalizer.rs"
doc = false

[[bin]]
name = "byte_scanner"
path = "fuzz_targets/byte_scanner.rs"
doc = false

[[bin]]
name = "artifact_wheel"
path = "fuzz_targets/artifact_wheel.rs"
doc = false
