[advisories]
version = 2
ignore = [
    # time RFC 2822 parsing DoS (stack exhaustion). Cargo.toml pins time to
    # <0.3.38 (0.3.38+ needs time-core >=0.1.3 / Rust 1.85, above our MSRV 1.83),
    # so the version we build predates the advisory's 0.3.47 fix and stays in the
    # affected range. Ignored regardless: that fix requires Rust 1.88 (far above
    # MSRV 1.83), and tirith never parses user-controlled RFC 2822 dates (the only
    # trigger). Transitive dep via lopdf/rust-s3. See the time pin note in Cargo.toml.
    "RUSTSEC-2026-0009",
    # lopdf 0.34 stack-overflow DoS: a crafted PDF with deeply nested arrays/dicts
    # aborts the process (uncatchable SIGABRT) during parse. The fix (lopdf >=0.42)
    # requires Rust 1.85, above tirith's MSRV 1.83, so we cannot bump lopdf. The
    # only untrusted entry point, check_pdf() in rules/rendered.rs, runs a
    # nesting-depth preflight (PDF_NESTING_DEPTH_CAP) that rejects the bomb BEFORE
    # load_mem is ever called, including a decompress-and-rescan of every
    # compressed object stream (repo-0332/pr173-0027: the former raw-bytes-only
    # preflight was bypassable via /ObjStm). Remove this ignore
    # (and the .cargo/audit.toml twin) once MSRV/lopdf can move.
    "RUSTSEC-2026-0187",
    # hickory-proto 0.24.4 BinEncoder name-compression DoS (O(n²) on a
    # malicious message with many labels). The fixed line is 0.26.1; that
    # resolver series is a different API than the 0.24 pin in
    # crates/tirith-core/Cargo.toml (MSRV 1.83). Tirith only encodes DNS
    # queries it constructs for hostnames already extracted from policy or
    # command text; it does not re-encode untrusted DNS messages. Remove
    # this ignore when the resolver can move to >=0.26.1.
    "RUSTSEC-2026-0119",
    # unsafe-libyaml 0.2.11 is unmaintained (an informational advisory; no
    # vulnerability is reported). It comes in only through serde_yaml 0.9,
    # which is itself deprecated and has no maintained release to move to.
    # serde_yaml parses policy, setup config and repository YAML (CI
    # workflows, tool configs) in about 30 modules, so replacing it is a
    # parser migration tracked separately from this release. Remove this
    # ignore (and the .cargo/audit.toml twin) once serde_yaml is replaced.
    "RUSTSEC-2024-0449",
    # zip 2.4.2: ZipArchive::extract and ZipStreamReader::extract keep SUID/SGID
    # bits (0367), create symlinks whose targets leave the destination (0368)
    # and apply permissions through symlinks (0369). ZipArchive::extract also
    # allocates a symlink target from its untrusted declared size (0429).
    # The fixed line is zip >=9.0.0 (Rust 1.88, above tirith's MSRV 1.83). Tirith
    # never calls either extract function: it reads wheel and artifact members
    # into memory by index, rejects symlink members, and writes no member to
    # disk; ZipWriter only builds archives in memory (tests and lab artifacts).
    # Remove these ignores (and the .cargo/audit.toml twin) once MSRV allows
    # zip >=9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
    # hickory-proto 0.24.4, three panics in the zone-file (record text) parser:
    # a malformed SVCB/HTTPS `alpn` value (0487), a lone quote as a parameter
    # value (0489) and a token of 4096 or more characters (0490). Records
    # decoded from the DNS wire format do not take that path. Tirith uses
    # hickory only through `TokioAsyncResolver::tokio_from_system_conf()` in
    # network/dns.rs: it sends queries and decodes wire responses, and never
    # parses a zone file or record text. The fix is 0.26.2, the same API and
    # MSRV break as the 0119 entry above. Remove these ignores (and the
    # .cargo/audit.toml twin) when the resolver can move to >=0.26.2.
    "RUSTSEC-2026-0487",
    "RUSTSEC-2026-0489",
    "RUSTSEC-2026-0490",
    # hickory-proto 0.24.4 reserves vectors sized by the record counts in a
    # DNS message header before reading any record, about 18 MB for a packet
    # that claims 65,535 records. THIS ONE IS REACHABLE: Tirith decodes
    # responses to its own lookups, so a resolver that is malicious, or an
    # on-path attacker who spoofs a response, can trigger it. The effect is a
    # transient allocation that is freed when decoding fails. It is not memory
    # corruption, and lookups are bounded per check by `DnsRequestBudget` and
    # the resolver timeout, so the cost is memory pressure for the length of a
    # lookup. Accepted until the resolver can move to >=0.26.2 (API and MSRV
    # break, as above); that upgrade is the real fix.
    "RUSTSEC-2026-0491",
    # libsqlite3-sys 0.30.1 bundles a SQLite that can return uninitialized
    # page-cache memory when it opens a database together with a crafted
    # `-wal` file of a different page size (CVE-2026-119375). Only a process
    # that opens database files a less trusted party could have written is
    # exposed. The tirith CLI does not link SQLite. The two optional servers do
    # (tools/policy-server, tools/license-server, through rusqlite 0.32), and
    # each opens only its own database, at a path the server operator
    # configures. The fix is libsqlite3-sys >=0.39 with rusqlite 0.41, which
    # need Rust 1.88 and 1.89; the MSRV job tests the whole workspace on 1.83.
    # Remove this ignore (and the .cargo/audit.toml twin) once MSRV allows
    # rusqlite >=0.41.
    "RUSTSEC-2026-0459",
    # pin-utils 0.1.0 is unmaintained (an informational advisory; no
    # vulnerability is reported, and the advisory lists no fixed release). It
    # comes in only through futures-util and hyper, under reqwest, axum,
    # tower-lsp and hickory. Nothing in this workspace depends on it directly.
    # Remove this ignore (and the .cargo/audit.toml twin) when those crates
    # stop depending on it.
    "RUSTSEC-2026-0441",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # NCSA is the permissive University of Illinois license used by the
    # libfuzzer-sys/LLVM libFuzzer component in the standalone fuzz workspace.
    "NCSA",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    # BSL-1.0 (Boost Software License 1.0) — permissive, OSI/FSF approved.
    # Reached transitively via `arboard` (M7 ch3 clipboard dep).
    "BSL-1.0",
    # MIT-0 (MIT No Attribution) — permissive, OSI approved; strictly looser than
    # MIT (drops the attribution clause). Reached transitively via the new
    # jsonschema dep (PR-0 spike): jsonschema -> referencing -> fluent-uri ->
    # borrow-or-share, which is MIT-0.
    "MIT-0",
    "OpenSSL",
    "Zlib",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "AGPL-3.0-only",
]

[bans]
multiple-versions = "warn"
