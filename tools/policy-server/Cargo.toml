[package]
name = "tirith-policy-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Optional self-hosted Tirith policy authority"
publish = false

[dependencies]
tirith-core = { workspace = true }
axum = { version = "=0.8.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
rusqlite = { version = "=0.32.1", features = ["bundled", "limits"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
libc = { workspace = true }
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
